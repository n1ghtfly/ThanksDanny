# Mosquitto for the Sons of Sudo badges (Claudio, Danny, Walter).
# Tested with Mosquitto 2.0.22. See README.md in this folder for setup.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Nobody gets in without a login; what each login may do is in the ACL file.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Slaps sent to a badge that is offline wait for it (QoS 1, persistent sessions) - but not forever.
persistent_client_expiration 14d
max_queued_messages 50

# --- Internet-facing: TLS on 8883 -------------------------------------------------------------
# The badges check the certificate against the standard public CA list, so use a certificate
# from a public CA such as Let's Encrypt (see README.md). A self-signed certificate will NOT be
# accepted by the badges.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem

# --- Poll website (v3.9): MQTT over WebSockets, for web/poll.html in a browser ------------------
# Plain WebSocket inside your network; put TLS in front of it (Nginx Proxy Manager proxy host with
# "Websockets Support", see README.md section 9) - browsers on an https page only allow wss://.
listener 9001
protocol websockets

# --- Optional: plain MQTT on 1883 for testing inside your own network only ---------------------
# Never forward this port on the router: passwords would travel unencrypted.
#listener 1883
