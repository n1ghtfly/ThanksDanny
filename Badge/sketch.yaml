# Build settings for the Badge sketch, read by arduino-cli (and flash_badge.cmd).
# Board: Waveshare ESP32-S3-Touch-AMOLED-1.75C (ESP32-S3R8, 8 MB PSRAM, 32 MB flash).
# The partition scheme matters: the wallpaper and cached pictures live in its LittleFS part.
default_fqbn: esp32:esp32:esp32s3:FlashSize=32M,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=app5M_little24M_32MB,FlashMode=qio
default_port: serial://COM13
